<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes proches</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f0;--card:#fff;--ink:#1c2b29;--mut:#63726f;--line:#dce5df;--acc:#2a7868;--accBg:#dcefe9;--warm:#a8650d;--warmBg:#fbefd9;--bad:#b0432d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a19;--card:#1a2523;--ink:#e7efec;--mut:#98a9a5;--line:#2a3836;--acc:#5fc2ab;--accBg:#21403a;--warm:#f0b25a;--warmBg:#3a2d17;--bad:#ef8b73}}
:root[data-theme="dark"]{--bg:#121a19;--card:#1a2523;--ink:#e7efec;--mut:#98a9a5;--line:#2a3836;--acc:#5fc2ab;--accBg:#21403a;--warm:#f0b25a;--warmBg:#3a2d17;--bad:#ef8b73}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-bottom:88px}
header,main{max-width:560px;margin:0 auto;padding:0 16px}header{padding-top:18px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}h1{font-size:28px}h2{font-size:20px;margin:22px 0 10px}
.sub{color:var(--mut);font-size:14px}.bad{color:var(--bad)}.warm{color:var(--warm)}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px}.g{flex:1;min-width:0}.nm{font-weight:600}
.av{width:42px;height:42px;border-radius:50%;background:var(--accBg);color:var(--acc);display:grid;place-items:center;font-weight:600;flex:none}
.em{font-size:24px}.em.s{font-size:15px;color:var(--warm);font-weight:600;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--card);border-color:var(--acc);font-weight:600}
button.x{border:0;background:none;color:var(--mut);padding:6px;font-size:14px}
.btns{display:flex;gap:8px;margin-top:12px}.btns button{flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;margin:0 0 8px}
input[type=checkbox],input[type=radio]{width:auto;margin:0}
textarea{resize:vertical}label{display:block;font-weight:500;margin:0 0 4px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty{color:var(--mut);padding:18px;border:1px dashed var(--line);border-radius:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{border:0;background:none;color:var(--mut);padding:10px 4px}nav button.on{color:var(--acc);font-weight:600;background:var(--accBg)}
#sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#sheet[hidden]{display:none}.in{max-width:560px;margin:0 auto;padding:14px 16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top h1{flex:1;font-size:24px}
.set{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:8px}.set label{display:flex;gap:6px;align-items:center;margin:0 0 8px;font-weight:400}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;padding-bottom:4px}.tabs button{white-space:nowrap;border-radius:99px;padding:8px 14px}.tabs button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}.m{margin:0;text-align:center}.m input{position:absolute;opacity:0}
.m span{display:block;font-size:26px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px}.m small{display:block;font-size:11px;color:var(--mut)}
.m input:checked+span{border-color:var(--acc);background:var(--accBg)}.m input:focus-visible+span{outline:2px solid var(--acc)}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.li>div,.li>label{flex:1;margin:0;font-weight:400}.done{text-decoration:line-through;color:var(--mut)}
@media(prefers-reduced-motion:no-preference){#sheet:not([hidden]){animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}}}
</style></head><body>
<header><h1>Mes proches</h1><div class="sub" id="dt"></div></header>
<main id="main"></main>
<nav><button data-act="nav" data-v="week">Cette semaine</button><button data-act="nav" data-v="ppl">Personnes</button><button data-act="nav" data-v="dates">Dates</button></nav>
<div id="sheet" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),dd=s=>new Date(s+'T12:00:00'),diff=(a,b)=>Math.round((dd(b)-dd(a))/864e5);
const fmt=s=>dd(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const MOODS=['😟','😕','😐','🙂','😄'],MN=['Au plus bas','Pas top','Moyen','Bien','Au top'];
let S={people:[]},view='week',open=null,tab='care',dbDoc=null,timer,armed=false;
const P=id=>S.people.find(p=>p.id===id);
const last=p=>p.last||p.created;
const due=p=>{const d=dd(last(p));d.setDate(d.getDate()+p.freq);return iso(d)};
const late=p=>diff(due(p),today());
const inWeek=p=>p.flag||diff(today(),due(p))<=7;
const mood=p=>{const m=(p.moods||[]).slice(-1)[0];return m?MOODS[m.v-1]:'·'};
const ago=n=>n<=0?"aujourd'hui":n===1?'hier':'il y a '+n+' j';
const freqL=f=>({1:'chaque jour',3:'tous les 3 jours',7:'chaque semaine',14:'toutes les 2 semaines',30:'chaque mois'}[f]||'tous les '+f+' jours');
const av=p=>'<div class="av">'+esc((p.name[0]||'?').toUpperCase())+'</div>';
function nextOcc(x){if(!x.yearly)return x.date;const t=today(),y=+t.slice(0,4);let c=y+x.date.slice(4);if(c<t)c=(y+1)+x.date.slice(4);return c}
function upDates(){const t=today(),r=[];S.people.forEach(p=>(p.dates||[]).forEach(x=>{const o=nextOcc(x);r.push({p,x,o,n:diff(t,o)})}));return r.filter(a=>a.n>=0&&a.n<=60).sort((a,b)=>a.n-b.n)}
const dateRow=a=>'<div class="card"><div class="row"><div class="g"><div class="nm">'+esc(a.x.label)+'</div><div class="sub">'+esc(a.p.name)+', '+fmt(a.o)+'</div></div><div class="em s">'+(a.n===0?"Aujourd'hui":'dans '+a.n+' j')+'</div></div></div>';
 
function weekV(){
  const l=S.people.filter(inWeek).sort((a,b)=>due(a)<due(b)?-1:1),ds=upDates().slice(0,3);
  let h='<h2>À appeler cette semaine</h2>';
  h+=l.length?l.map(p=>{const n=late(p);
    const st=n>0?'<b class="bad">En retard de '+n+' j</b>':n===0?'<b class="warm">À appeler aujourd\'hui</b>':'<b class="warm">À appeler d\'ici '+(-n)+' j</b>';
    return '<div class="card"><div class="row">'+av(p)+'<div class="g"><div class="nm">'+esc(p.name)+'</div><div class="sub">'+st+'</div><div class="sub">Dernier contact '+ago(diff(last(p),today()))+(p.flag?', sur ma liste':'')+'</div></div><div class="em">'+mood(p)+'</div></div><div class="btns"><button class="pri" data-act="quick" data-id="'+p.id+'">Appel fait</button><button data-act="open" data-id="'+p.id+'">Ouvrir la fiche</button></div></div>'}).join('')
  :'<div class="empty">'+(S.people.length?'Personne à appeler pour l\'instant.':'Ajoute ta première personne dans l\'onglet Personnes.')+'</div>';
  if(ds.length)h+='<h2>Dates à venir</h2>'+ds.map(dateRow).join('');
  return h}
function pplV(){
  return '<h2>Personnes</h2><div class="card"><label for="nn">Ajouter une personne</label><div class="row"><input id="nn" placeholder="Prénom" maxlength="40" style="margin:0"><button class="pri" data-act="add">Ajouter</button></div></div>'+
  (S.people.length?S.people.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(p=>'<button class="card" data-act="open" data-id="'+p.id+'"><div class="row">'+av(p)+'<div class="g"><div class="nm">'+esc(p.name)+'</div><div class="sub">Nouvelles '+freqL(p.freq)+'</div></div><div class="em">'+mood(p)+'</div></div></button>').join(''):'<div class="empty">Aucune personne pour le moment.</div>')}
function datesV(){const d=upDates();return '<h2>Dates des 60 prochains jours</h2>'+(d.length?d.map(dateRow).join(''):'<div class="empty">Rien de prévu. Ajoute des anniversaires ou des événements depuis la fiche d\'une personne.</div>')}
 
function sheetV(){
  const p=P(open);if(!p)return '';
  const T=[['care','Prendre soin'],['mood','Ressenti'],['log','Échanges'],['dates','Dates'],['ideas','Idées']];
  let b='';
  if(tab==='care')b='<label for="c1">Ce qui lui fait du bien</label><textarea id="c1" data-f="care" rows="4">'+esc(p.care||'')+'</textarea><label for="c2">Ses besoins en ce moment</label><textarea id="c2" data-f="needs" rows="4">'+esc(p.needs||'')+'</textarea><button class="x" data-act="delp">Supprimer cette personne</button>';
  if(tab==='mood')b='<div class="moods">'+MOODS.map((m,i)=>'<label class="m"><input type="radio" name="mv" value="'+(i+1)+'"><span>'+m+'<small>'+MN[i]+'</small></span></label>').join('')+'</div><textarea id="mn" rows="2" placeholder="Note (facultatif)"></textarea><button class="pri" data-act="savemood">Enregistrer son ressenti</button>'+
    (p.moods||[]).slice().reverse().map(m=>'<div class="li"><span class="em">'+MOODS[m.v-1]+'</span><div><div class="sub">'+fmt(m.date)+'</div>'+esc(m.text||'')+'</div></div>').join('');
  if(tab==='log')b='<select id="lt" aria-label="Type d\'échange"><option>Appel</option><option>Message</option><option>Visite</option></select><textarea id="ln" rows="2" placeholder="De quoi avez-vous parlé ?"></textarea><button class="pri" data-act="addlog">Ajouter l\'échange</button>'+
    (p.log||[]).slice().reverse().map(m=>'<div class="li"><div><div class="sub">'+esc(m.type)+', '+fmt(m.date)+'</div>'+esc(m.text||'')+'</div></div>').join('');
  if(tab==='dates')b='<input id="dl" placeholder="Anniversaire, rendez-vous…" maxlength="60"><input id="dv" type="date" aria-label="Date"><label style="font-weight:400"><input id="dy" type="checkbox" checked> Se répète chaque année</label><button class="pri" data-act="adddate" style="margin-top:8px">Ajouter la date</button>'+
    (p.dates||[]).map((x,i)=>'<div class="li"><div><div class="nm">'+esc(x.label)+'</div><div class="sub">'+fmt(x.date)+(x.yearly?', chaque année':'')+'</div></div><button class="x" data-act="deldate" data-i="'+i+'">Retirer</button></div>').join('');
  if(tab==='ideas')b='<div class="row"><input id="ii" placeholder="Une attention, un cadeau…" maxlength="80" style="margin:0"><button class="pri" data-act="addidea">Ajouter</button></div>'+
    (p.ideas||[]).map((x,i)=>'<div class="li"><label><input type="checkbox" data-act="tgi" data-i="'+i+'" '+(x.done?'checked':'')+'> <span class="'+(x.done?'done':'')+'">'+esc(x.text)+'</span></label><button class="x" data-act="deli" data-i="'+i+'">Retirer</button></div>').join('');
  return '<div class="in"><div class="top"><button data-act="close" aria-label="Retour">Retour</button><h1>'+esc(p.name)+'</h1><div class="em">'+mood(p)+'</div></div>'+
    '<div class="set"><select data-f="freq" aria-label="Fréquence des nouvelles">'+[1,3,7,14,30].map(f=>'<option value="'+f+'"'+(p.freq===f?' selected':'')+'>Nouvelles '+freqL(f)+'</option>').join('')+'</select><label><input type="checkbox" data-f="flag" '+(p.flag?'checked':'')+'> Sur ma liste</label></div>'+
    '<div class="tabs">'+T.map(t=>'<button data-act="tab" data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>'+b+'</div>'}
 
function render(){
  $('#dt').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  $('#main').innerHTML=view==='week'?weekV():view==='ppl'?pplV():datesV();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const s=$('#sheet');s.hidden=!open;s.innerHTML=open?sheetV():''}
function save(){try{localStorage.setItem('mp',JSON.stringify(S))}catch(e){}
  clearTimeout(timer);timer=setTimeout(async()=>{if(dbDoc){try{await dbDoc.set({people:S.people})}catch(e){}}},400)}
function addLog(p,type,text){(p.log=p.log||[]).push({date:today(),type,text});p.last=today();p.flag=false}
 
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,i=+el.dataset.i,p=P(open||id);
  if(a==='nav'){view=el.dataset.v}
  else if(a==='open'){open=id;tab='care';armed=false}
  else if(a==='close'){open=null}
  else if(a==='tab'){tab=el.dataset.t}
  else if(a==='add'){const v=$('#nn').value.trim();if(!v)return;S.people.push({id:'p'+Date.now().toString(36),name:v,freq:7,created:today(),moods:[],log:[],dates:[],ideas:[]})}
  else if(a==='quick'&&p){addLog(p,'Appel','')}
  else if(a==='savemood'&&p){const r=document.querySelector('input[name=mv]:checked');if(!r)return;(p.moods=p.moods||[]).push({date:today(),v:+r.value,text:$('#mn').value.trim()})}
  else if(a==='addlog'&&p){addLog(p,$('#lt').value,$('#ln').value.trim())}
  else if(a==='adddate'&&p){const l=$('#dl').value.trim(),d=$('#dv').value;if(!l||!d)return;(p.dates=p.dates||[]).push({label:l,date:d,yearly:$('#dy').checked})}
  else if(a==='deldate'&&p){p.dates.splice(i,1)}
  else if(a==='addidea'&&p){const t=$('#ii').value.trim();if(!t)return;(p.ideas=p.ideas||[]).push({text:t,done:false})}
  else if(a==='tgi'&&p){p.ideas[i].done=!p.ideas[i].done}
  else if(a==='deli'&&p){p.ideas.splice(i,1)}
  else if(a==='delp'&&p){if(!armed){armed=true;el.textContent='Confirmer la suppression';return}S.people=S.people.filter(x=>x.id!==p.id);open=null;armed=false}
  save();render()});
document.addEventListener('change',e=>{
  const f=e.target.dataset.f,p=P(open);if(!f||!p)return;
  p[f]=f==='freq'?+e.target.value:f==='flag'?e.target.checked:e.target.value;save();if(f!=='care'&&f!=='needs')render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nn')document.querySelector('[data-act=add]').click();if(e.key==='Escape'&&open){open=null;render()}});
 
async function init(){
  try{const l=localStorage.getItem('mp');if(l)S=JSON.parse(l)}catch(e){}
  render();
  try{
    if(!window.claude)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbDoc=db.doc('data/users/'+id+'/app');
    const sn=await dbDoc.get();
    if(sn.exists){S={people:(sn.data().people)||[]};try{localStorage.setItem('mp',JSON.stringify(S))}catch(e){}}
    else if(S.people.length){dbDoc.set({people:S.people}).catch(()=>{})}
    render();
  }catch(e){}
}
init();
</script></body></html>
